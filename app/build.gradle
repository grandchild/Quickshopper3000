plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

def unknownVersionFallback = "0.1"

def versionFile = rootProject.file('version.properties')
def versionProps = new Properties()
if (versionFile.exists()) versionProps.load(versionFile.newDataInputStream())
def versionBase = versionProps['version'] ?: unknownVersionFallback
def buildNum = (versionProps['build'] ?: '0').toInteger() + 1
versionProps['build'] = buildNum.toString()
versionProps['version'] = versionBase
versionProps.store(versionFile.newDataOutputStream(), null)

android {
    namespace 'org.effekthasch.quickshopper3k'
    compileSdk 36

    defaultConfig {
        applicationId "org.effekthasch.quickshopper3k"
        minSdk 26
        targetSdk 36
        versionCode buildNum
        versionName "$versionBase-$buildNum"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each {
            it.outputFileName.set("qs3k-v$versionBase-$buildNum-${variant.buildType}-unsigned.apk")
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.7'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'org.json:json:20251224'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
}
